<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="sahayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B4FBB" />
      <stop offset="100%" stop-color="#E0407B" />
    </linearGradient>
    <linearGradient id="softGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FAF9FC" />
      <stop offset="100%" stop-color="#EDE9FE" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6B4FBB" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Gentle Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#softGlow)" stroke="#E9D5FF" stroke-width="2" filter="url(#shadow)" />

  <!-- Calming Lotus Petals / Uplifting Wings -->
  <!-- Left Petal -->
  <path d="M100 135 C70 125, 45 95, 60 65 C72 82, 85 110, 100 135 Z" fill="url(#sahayGradient)" opacity="0.85" />
  
  <!-- Right Petal -->
  <path d="M100 135 C130 125, 155 95, 140 65 C128 82, 115 110, 100 135 Z" fill="url(#sahayGradient)" opacity="0.85" />
  
  <!-- Center Uplifting Heart & Flame Petal -->
  <path d="M100 45 C80 80, 85 115, 100 140 C115 115, 120 80, 100 45 Z" fill="url(#sahayGradient)" />

  <!-- Calming Heart Emblem in Center Base -->
  <path d="M100 122 C94 114, 84 114, 80 122 C74 133, 90 145, 100 154 C110 145, 126 133, 120 122 C116 114, 106 114, 100 122 Z" fill="#FFFFFF" />

  <!-- Protective Supporting Hands Base -->
  <path d="M60 145 C80 162, 120 162, 140 145 C125 156, 75 156, 60 145 Z" fill="url(#sahayGradient)" opacity="0.6" />
</svg>
